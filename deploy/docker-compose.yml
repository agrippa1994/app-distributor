# Example stack for a Traefik-fronted Docker host (see README "Deployment").
services:
  app-distributor:
    image: registry.mani.codes/app-distributor:${APP_DISTRIBUTOR_TAG}
    restart: unless-stopped
    environment:
      PUBLIC_URL: https://${APP_DISTRIBUTOR_DOMAIN}
      SESSION_SECRET: ${SESSION_SECRET}
      KEEP_VERSIONS: ${KEEP_VERSIONS:-0}
      # Contact for Web Push services; defaults to PUBLIC_URL.
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
    volumes:
      - app-distributor-data:/data
    networks:
      - proxy
    labels:
      - traefik.enable=true
      - traefik.http.routers.app-distributor.rule=Host(`${APP_DISTRIBUTOR_DOMAIN}`)
      - traefik.http.routers.app-distributor.entrypoints=websecure
      - traefik.http.routers.app-distributor.tls=true
      - traefik.http.routers.app-distributor.tls.certresolver=letsencrypt
      - traefik.http.services.app-distributor.loadbalancer.server.port=3000

volumes:
  app-distributor-data:
    labels:
      - backup.volume.enable=true
      - backup.volume.prefix=app-distributor-volume/

networks:
  proxy:
    external: true
